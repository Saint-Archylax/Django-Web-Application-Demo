<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Book Rental System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html">📚 Book Rental System</a>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="auth-container">
                <h1>Login</h1>
                <div id="loginAlert" class="alert" style="display:none; margin-bottom: 1rem;"></div>
                <p class="auth-link" style="margin-top:0; margin-bottom:1rem;">
                    Demo account: <strong>demo</strong> / <strong>demo123</strong>
                </p>
                <form class="auth-form" id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="id_username">Username</label>
                        <input type="text" name="username" id="id_username" class="form-input" placeholder="Enter your username" autocomplete="username" required>
                    </div>

                    <div class="form-group">
                        <label for="id_password">Password</label>
                        <input type="password" name="password" id="id_password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-block">Login</button>
                    </div>
                </form>
                <p class="auth-link">Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Book Rental System. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const form = document.getElementById('loginForm');
        const alertBox = document.getElementById('loginAlert');

        function showMessage(message, type) {
            alertBox.textContent = message;
            alertBox.className = 'alert alert-' + type;
            alertBox.style.display = 'block';
        }

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const username = document.getElementById('id_username').value.trim();
            const password = document.getElementById('id_password').value;

            if (!username || !password) {
                showMessage('Enter both your username and password.', 'error');
                return;
            }

            let registeredUser = null;
            try {
                registeredUser = JSON.parse(localStorage.getItem('registeredUser_' + username) || 'null');
            } catch (error) {
                showMessage('Your browser storage is unavailable. Try enabling cookies/site data or use another browser.', 'error');
                return;
            }

            const isDemoAccount = username === 'demo' && password === 'demo123';
            const isRegisteredAccount = registeredUser && registeredUser.password === password;

            if (!isDemoAccount && !isRegisteredAccount) {
                showMessage('Invalid login. Use demo / demo123, or register first in this browser.', 'error');
                return;
            }

            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('username', username);
            showMessage('Login successful. Redirecting…', 'success');

            setTimeout(function () {
                window.location.assign('index.html');
            }, 600);
        });
    </script>
</body>
</html>
