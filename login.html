<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Book Rental System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html">📚 Book Rental System</a>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="auth-container">
                <h1>Login</h1>
                <div id="loginAlert" class="alert alert-success" style="display:none; margin-bottom: 1rem;">
                    Login successful! Redirecting...
                </div>
                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label for="id_username">Username</label>
                        <input type="text" name="username" id="id_username" class="form-input" placeholder="Enter your username" required>
                    </div>

                    <div class="form-group">
                        <label for="id_password">Password</label>
                        <input type="password" name="password" id="id_password" class="form-input" placeholder="Enter your password" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-block">Login</button>
                    </div>
                </form>
                <p class="auth-link">Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Book Rental System. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Simulate user session storage
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('id_username').value;
            const password = document.getElementById('id_password').value;
            
            // Simple validation
            if (username.length < 3) {
                alert('Username must be at least 3 characters long');
                return;
            }
            
            if (password.length < 6) {
                alert('Password must be at least 6 characters long');
                return;
            }
            
            // Store user session in localStorage
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('username', username);
            
            // Show success message
            document.getElementById('loginAlert').style.display = 'block';
            
            // Redirect to home after 1.5 seconds
            setTimeout(function() {
                window.location.href = 'index.html';
            }, 1500);
        });
    </script>
</body>
</html>
