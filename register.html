<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Book Rental System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html">📚 Book Rental System</a>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="auth-container">
                <h1>Register</h1>
                <div id="registerAlert" class="alert alert-success" style="display:none; margin-bottom: 1rem;">
                    Registration successful! Redirecting to login...
                </div>
                <form class="auth-form" id="registerForm">
                    <div class="form-group">
                        <label for="id_username">Username</label>
                        <input type="text" name="username" id="id_username" class="form-input" placeholder="Enter your username" required>
                    </div>

                    <div class="form-group">
                        <label for="id_email">Email</label>
                        <input type="email" name="email" id="id_email" class="form-input" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="id_password1">Password</label>
                        <input type="password" name="password1" id="id_password1" class="form-input" placeholder="Enter your password" required>
                    </div>

                    <div class="form-group">
                        <label for="id_password2">Confirm Password</label>
                        <input type="password" name="password2" id="id_password2" class="form-input" placeholder="Confirm your password" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-block">Register</button>
                    </div>
                </form>
                <p class="auth-link">Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Book Rental System. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('id_username').value;
            const email = document.getElementById('id_email').value;
            const password1 = document.getElementById('id_password1').value;
            const password2 = document.getElementById('id_password2').value;
            
            // Validation
            if (username.length < 3) {
                alert('Username must be at least 3 characters long');
                return;
            }
            
            if (!email.includes('@')) {
                alert('Please enter a valid email address');
                return;
            }
            
            if (password1.length < 6) {
                alert('Password must be at least 6 characters long');
                return;
            }
            
            if (password1 !== password2) {
                alert('Passwords do not match');
                return;
            }
            
            // Store user data in localStorage
            localStorage.setItem('registeredUser_' + username, JSON.stringify({
                username: username,
                email: email,
                password: password1
            }));
            
            // Show success message
            document.getElementById('registerAlert').style.display = 'block';
            
            // Redirect to login after 2 seconds
            setTimeout(function() {
                window.location.href = 'login.html';
            }, 2000);
        });
    </script>
</body>
</html>
